<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Bharat Mechanics — genuine auto parts and doorstep mechanic service">
  <title>Bharat Mechanics hero banner</title>
  <desc>Wide deep-navy banner. Headline Genuine Auto Parts, Doorstep Mechanics, with a steel gear-and-wheel emblem and a doorstep location badge on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3B6F"/>
      <stop offset="0.55" stop-color="#15315c"/>
      <stop offset="1" stop-color="#0e2140"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ecf5"/>
      <stop offset="1" stop-color="#94a3bd"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab6cc"/>
      <stop offset="1" stop-color="#6f7d97"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>
  <circle cx="1080" cy="150" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <g transform="translate(1080,150)">
    <circle r="132" fill="none" stroke="url(#steel)" stroke-width="24" stroke-dasharray="26 22"/>
    <circle r="124" fill="none" stroke="#c3cddd" stroke-width="5"/>
    <circle r="110" fill="#0b1c34"/>
    <circle r="110" fill="none" stroke="#22467f" stroke-width="4"/>
    <circle r="100" fill="none" stroke="#1c3a68" stroke-width="12" stroke-dasharray="6 11"/>
    <circle r="70" fill="url(#rim)"/>
    <circle r="70" fill="none" stroke="#7f8ca6" stroke-width="3"/>
    <g stroke="#7d8aa3" stroke-width="9" stroke-linecap="round">
      <line x1="0" y1="-16" x2="0" y2="-60"/>
      <line x1="0" y1="16" x2="0" y2="60"/>
      <line x1="-16" y1="0" x2="-60" y2="0"/>
      <line x1="16" y1="0" x2="60" y2="0"/>
      <line x1="-11" y1="-11" x2="-43" y2="-43"/>
      <line x1="11" y1="11" x2="43" y2="43"/>
      <line x1="11" y1="-11" x2="43" y2="-43"/>
      <line x1="-11" y1="11" x2="-43" y2="43"/>
    </g>
    <circle r="19" fill="#1B3B6F"/>
    <circle r="8.5" fill="#FF6B35"/>
  </g>

  <g transform="translate(1162,196)">
    <path d="M0 -22 C 13 -22 22 -12 22 0 C 22 15 6 25 0 35 C -6 25 -22 15 -22 0 C -22 -12 -13 -22 0 -22 Z" fill="#FF6B35"/>
    <circle cy="-3" r="9.5" fill="#ffffff"/>
    <path d="M-4.5 -3 l3 3.6 l6 -7.4" fill="none" stroke="#FF6B35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="70" y="42" width="116" height="5" rx="2.5" fill="#FF9933"/>
  <rect x="194" y="42" width="40" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <rect x="242" y="42" width="40" height="5" rx="2.5" fill="#138808"/>

  <text x="70" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#FF8A5B">BHARAT MECHANICS</text>
  <text x="68" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Genuine Auto Parts,</text>
  <text x="68" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#FF6B35">Doorstep Mechanics.</text>
  <text x="70" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#c5d0e3">500+ trusted brands · Verified mechanics · Transparent pricing</text>

