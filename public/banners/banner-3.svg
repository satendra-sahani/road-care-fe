<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Verified mechanics and transparent pricing">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13284a"/>
      <stop offset="1" stop-color="#0c1d36"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2c5aa0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2c5aa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" fill="url(#bg3)"/>
  <rect width="1280" height="300" fill="url(#glow3)"/>
  <!-- decorative shield + check (right) -->
  <g transform="translate(1045,150)">
    <path d="M0 -98 L86 -64 V8 C86 60 48 92 0 110 C-48 92 -86 60 -86 8 V-64 Z" fill="url(#shield3)"/>
    <path d="M-34 4 L-10 30 L40 -28" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- tricolor accent strip -->
  <rect x="70" y="58" width="170" height="5" rx="2.5" fill="#FF9933"/>
  <rect x="244" y="58" width="56" height="5" rx="2.5" fill="#ffffff" opacity="0.85"/>
  <rect x="304" y="58" width="56" height="5" rx="2.5" fill="#138808"/>
  <!-- copy -->
  <text x="70" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">Verified Mechanics.</text>
  <text x="70" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#FF6B35">Zero Surprises.</text>
  <text x="72" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#c5d0e3">Aadhaar-verified pros · upfront quotes · 7-day service warranty</text>
  <!-- CTA -->
  <g transform="translate(72,234)">
    <rect width="186" height="46" rx="23" fill="#FF6B35"/>
    <text x="30" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Get Started</text>
    <path d="M142 23 h18 m0 0 l-7 -7 m7 7 l-7 7" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
