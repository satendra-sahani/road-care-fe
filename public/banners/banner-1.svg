<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Genuine auto parts delivered fast">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3B6F"/>
      <stop offset="0.55" stop-color="#16335f"/>
      <stop offset="1" stop-color="#0f2340"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe6f0"/>
      <stop offset="1" stop-color="#9aa7bd"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" fill="url(#bg1)"/>
  <rect width="1280" height="300" fill="url(#glow1)"/>
  <!-- tricolor accent strip -->
  <rect x="70" y="58" width="170" height="5" rx="2.5" fill="#FF9933"/>
  <rect x="244" y="58" width="56" height="5" rx="2.5" fill="#ffffff" opacity="0.85"/>
  <rect x="304" y="58" width="56" height="5" rx="2.5" fill="#138808"/>
  <!-- decorative wheel -->
  <g transform="translate(1040,150)">
    <circle r="118" fill="#0c1d36"/>
    <circle r="112" fill="none" stroke="#22467f" stroke-width="6"/>
    <circle r="74" fill="url(#rim1)"/>
    <circle r="20" fill="#1B3B6F"/>
    <circle r="9" fill="#FF6B35"/>
    <g stroke="#7d8aa3" stroke-width="9" stroke-linecap="round">
      <line x1="0" y1="-16" x2="0" y2="-66"/>
      <line x1="0" y1="16" x2="0" y2="66"/>
      <line x1="-16" y1="0" x2="-66" y2="0"/>
      <line x1="16" y1="0" x2="66" y2="0"/>
      <line x1="-11" y1="-11" x2="-47" y2="-47"/>
      <line x1="11" y1="11" x2="47" y2="47"/>
      <line x1="11" y1="-11" x2="47" y2="-47"/>
      <line x1="-11" y1="11" x2="-47" y2="47"/>
    </g>
  </g>
  <!-- copy -->
  <text x="70" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">Genuine Auto Parts,</text>
  <text x="70" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#FF6B35">Delivered Fast.</text>
  <text x="72" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#c5d0e3">100% authentic Bosch, Denso, NGK &amp; 500+ brands · 1–3 day delivery</text>
  <!-- CTA -->
  <g transform="translate(72,234)">
    <rect width="196" height="46" rx="23" fill="#FF6B35"/>
    <text x="32" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Shop Parts</text>
    <path d="M150 23 h18 m0 0 l-7 -7 m7 7 l-7 7" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
