  <text x="70" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">Doorstep Mechanic</text>
  <text x="70" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#FF6B35">Service at Your Home.</text>
